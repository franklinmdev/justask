name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-location:
    name: docs location
    runs-on: ubuntu-latest
    # Every push, plus pull requests from forks. Pull requests from a branch of
    # this repository are already covered by the push event.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Markdown lives in docs/, beside the root canonicals; the allowlist in
      # .claude/docs-allowlist adds this repo's exceptions.
      - name: Check markdown location
        run: bash scripts/check-docs-location.sh

  check:
    name: lint, typecheck and test
    runs-on: ubuntu-latest
    # Same event rules as docs location.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Tests resolve the entry points to src/. Build, then import each one
      # through the exports map as Node would, to prove dist/ resolves too.
      - run: pnpm build
      - run: node -e "Promise.all(['justask','justask/react','justask/jev'].map((e) => import(e)))"

name: Release

# npm's trusted publisher for @justask/core names this file and the
# npm-publish environment (#259); renaming either breaks the publish.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every CI job, so nothing reaches npm that CI would fail. ci.yml skips its
  # own push run on main, so main is checked once, here.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm-publish
    # A constant group, so two pushes never run npm publish at once for the
    # same version; the second waits instead of being cancelled.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Trusted publishing needs npm 11.5.1+ and Node 22.14+ (npm docs, read
      # 2026-10-01); Node 24 bundles npm 11. No cache in a release build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Publish only when package.json's version is not on npm, so a push
      # without a version bump is a no-op and a re-run never republishes.
      # npm view exits non-zero both for a missing version (E404, publish)
      # and for a registry or network failure, which stops the job instead.
      - id: version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          set +e
          REMOTE="$(npm view "${NAME}@${VERSION}" version 2>"$RUNNER_TEMP/npm-view.err")"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ] && [ -n "$REMOTE" ]; then
            echo "${NAME}@${VERSION} is already on npm, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
            echo "${NAME}@${VERSION} is not on npm, publishing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-view.err"
            echo "::error::npm view failed for a reason other than E404, so nothing is published."
            exit 1
          fi

      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: pnpm build
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
